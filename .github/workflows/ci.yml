name: MealHisab CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check migration timestamp uniqueness
        run: |
          duplicates=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate Supabase migration timestamp(s):"
            echo "$duplicates"
            exit 1
          fi
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Export local Supabase credentials
        run: |
          supabase status -o env > /tmp/supabase-env
          api_url=$(sed -n 's/^API_URL="\(.*\)"/\1/p' /tmp/supabase-env)
          anon_key=$(sed -n 's/^ANON_KEY="\(.*\)"/\1/p' /tmp/supabase-env)
          test -n "$api_url"
          test -n "$anon_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=$api_url" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
      - name: Build production app
        run: npm run build
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Run database integration tests
        run: supabase test db
      - name: Run Playwright end-to-end and accessibility tests
        run: npm run test:e2e
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
      - run: npm run lint
      - run: npm run test
