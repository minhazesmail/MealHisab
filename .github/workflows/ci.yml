name: MealHisab CI
on:
  push:
    branches: [main, audit/database-integration-tests]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check migration timestamp uniqueness
        run: |
          duplicates=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate Supabase migration timestamp(s):"
            echo "$duplicates"
            exit 1
          fi
      - run: npm ci
      - name: Diagnose dependency advisories
        run: npm audit --json || true
      - run: npm run typecheck
      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Run database integration tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
      - run: npm run lint
      - run: npm run test
