name: Vercel auth probe

on:
  push:
    branches: [ops/vercel-auth-probe]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel token availability
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not configured in GitHub Actions secrets."
            exit 2
          fi
          echo "VERCEL_TOKEN is configured."
